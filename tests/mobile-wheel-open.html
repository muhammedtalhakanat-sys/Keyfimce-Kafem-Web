<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobil çark doğrulaması</title>
    <style>
      html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#fff8f2}
    </style>
  </head>
  <body>
    <iframe id="app" src="../index.html" title="Mobil çark önizlemesi"></iframe>
    <script>
      const frame = document.getElementById('app');
      frame.addEventListener('load', () => {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        window.setTimeout(() => {
          doc.getElementById('welcomeScreen')?.remove();
          const nav = doc.getElementById('catNav');
          if (!nav) return;
          nav.scrollIntoView({ block: 'center' });
          nav.click();
          const rect = nav.getBoundingClientRect();
          const x = rect.left + rect.width / 2;
          const y = rect.top + rect.height / 2;
          const pointer = (type, clientY) => nav.dispatchEvent(new win.PointerEvent(type, {
            bubbles: true, cancelable: true, pointerId: 88, pointerType: 'touch', clientX: x, clientY
          }));
          pointer('pointerdown', y);
          pointer('pointermove', y - 126);
          pointer('pointerup', y - 126);
        }, 900);
      });
    </script>
  </body>
</html>
